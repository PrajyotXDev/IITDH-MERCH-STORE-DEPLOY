<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPI Order Review — IIT DH Merch Store</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 text-gray-900"><main class="max-w-5xl mx-auto p-5 md:p-10"><h1 class="text-3xl font-black mb-2">UPI Order Review</h1><p class="text-gray-600 mb-6">Verify the transaction in the actual bank/UPI account before approving. A UTR alone is not proof of payment.</p><section class="bg-white rounded-xl p-5 shadow mb-6"><label class="block font-semibold mb-2" for="token">Admin token</label><input id="token" type="password" autocomplete="current-password" class="border rounded-lg p-3 w-full mb-3" placeholder="ADMIN_TOKEN"><button id="load" class="bg-purple-800 text-white rounded-lg px-5 py-3 font-bold">Load orders</button><p id="status" class="mt-3 text-sm"></p></section><section id="orders" class="space-y-4"></section></main><script>
const tokenEl=document.getElementById('token'), statusEl=document.getElementById('status'), ordersEl=document.getElementById('orders');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function shot(el,id){try{const r=await fetch('/admin/orders/'+encodeURIComponent(id)+'/screenshot',{headers:{'x-admin-token':tokenEl.value}});if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob());el.innerHTML='<a href="'+u+'" target="_blank"><img src="'+u+'" class="max-h-72 rounded border mt-3"></a>'}catch{el.textContent='Screenshot unavailable'}}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json','x-admin-token':tokenEl.value,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){ordersEl.innerHTML='';try{const d=await api('/admin/orders');const pending=d.orders.filter(o=>o.paymentStatus==='PENDING_REVIEW');statusEl.textContent=`${pending.length} pending order(s)`;for(const o of pending){const el=document.createElement('article');el.className='bg-white rounded-xl p-5 shadow';el.innerHTML=`<h2 class="font-black text-xl">${esc(o.orderId)} — ₹${esc(o.total)}</h2><p class="mt-2">${esc(o.name)} · ${esc(o.email)} · Roll: ${esc(o.rollNo)}</p><p>Phone: ${esc(o.phone)} · Batch: ${esc(o.batchYear)}</p><p class="mt-2"><b>UTR:</b> ${esc(o.upiReference)}</p><p class="mt-2">${o.items.map(i=>`${esc(i.name)} / ${esc(i.color)} / ${esc(i.size)} × ${esc(i.quantity)}`).join('<br>')}</p><div class="shot"></div><label class="flex gap-2 items-start mt-4"><input type="checkbox" class="confirm mt-1"><span>I independently verified the exact amount and UTR in the bank/UPI account.</span></label><button class="approve mt-4 bg-green-700 text-white rounded-lg px-4 py-2 font-bold">Approve payment</button><p class="msg mt-2 text-sm"></p>`;el.querySelector('.approve').onclick=async()=>{if(!el.querySelector('.confirm').checked){el.querySelector('.msg').textContent='Confirm bank verification first.';return}try{await api('/admin/orders/'+encodeURIComponent(o.orderId)+'/approve-upi',{method:'POST',body:JSON.stringify({confirmBankVerified:true})});el.querySelector('.msg').textContent='Approved. Collection QR email processing started.';el.querySelector('.approve').disabled=true}catch(e){el.querySelector('.msg').textContent=e.message}};ordersEl.appendChild(el);shot(el.querySelector('.shot'),o.orderId)}}catch(e){statusEl.textContent=e.message}}
document.getElementById('load').onclick=load;
</script></body></html>
