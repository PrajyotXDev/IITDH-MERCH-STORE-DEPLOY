<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Staff Review — IIT DH Merch Store</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#19151f;background:#f5f3f8}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:900px;margin:auto}
.card{background:#fff;border:1px solid #e5deef;border-radius:14px;padding:18px;margin:14px 0}h1{margin:0 0 6px;color:#4b2a7b}.muted{color:#625b6d;font-size:.9rem}
input,select,button,textarea{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid #d4cbdc;width:100%;margin:5px 0 10px}button{width:auto;cursor:pointer;font-weight:700;background:#4b2a7b;color:#fff;border:0;margin-right:8px}
button.ok{background:#177a3a}button.no{background:#a52828}button.alt{background:#eee9f4;color:#30243c}button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:160px}.badge{display:inline-block;padding:2px 9px;border-radius:99px;background:#eee9f4;font-size:.8rem;font-weight:700}
img.shot{max-width:100%;max-height:340px;border:1px solid #ddd;border-radius:8px;margin-top:8px}.msg{margin-top:6px;font-size:.9rem;white-space:pre-wrap}.chk{display:flex;gap:8px;align-items:flex-start}.chk input{width:auto;margin-top:4px}
</style></head><body><div class="wrap">
<h1>Staff order review</h1><p class="muted">A screenshot or UTR is NOT proof of payment. Approve only after you have seen this exact UTR and the exact amount credited in the receiving bank/UPI account.</p>
<section class="card"><label for="token">Your staff token</label><input id="token" type="password" autocomplete="off" placeholder="Paste your personal staff token">
<div class="row"><div><label for="status">Show orders</label><select id="status"><option value="PENDING_REVIEW">Pending verification</option><option value="PAID">Approved (paid)</option><option value="REJECTED">Rejected</option></select></div><div><button id="load">Load orders</button></div></div>
<p id="state" class="muted"></p></section><section id="orders"></section></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('token').value=sessionStorage.getItem('merchStaffToken')||'';
async function api(url,opts={}){const t=$('token').value.trim();if(!t)throw Error('Paste your staff token first.');const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+t,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed ('+r.status+')');sessionStorage.setItem('merchStaffToken',t);return d}
async function showShot(box,id){box.textContent='Loading screenshot…';try{const d=await api('/admin/orders/'+encodeURIComponent(id)+'/screenshot-url');box.innerHTML='';const a=document.createElement('a');a.href=d.url;a.target='_blank';a.rel='noopener noreferrer';const im=document.createElement('img');im.className='shot';im.src=d.url;a.appendChild(im);box.appendChild(a);const n=document.createElement('div');n.className='muted';n.textContent='Link expires in '+d.expiresInSeconds+'s. Reload to view again.';box.appendChild(n)}catch(e){box.textContent='Screenshot unavailable: '+e.message}}
function card(o,status){const el=document.createElement('article');el.className='card';
let h=`<h3>${esc(o.orderId)} · ₹${esc(o.total)} <span class="badge">${esc(o.paymentStatus)}</span></h3><p>${esc(o.name)} · ${esc(o.email)} · Roll ${esc(o.rollNo)} · ${esc(o.phone)} · ${esc(o.batchYear)}</p><p><b>Student-entered UTR:</b> ${esc(o.upiReference)}</p><p>${(o.items||[]).map(i=>esc(i.name)+' / '+esc(i.color)+' / '+esc(i.size)+' × '+esc(i.quantity)+(i.customName&&i.customName!=='N/A'?' (print: '+esc(i.customName)+')':'')).join('<br>')}</p><div class="shotbox"><button class="alt view">View screenshot</button></div>`;
if(status==='PENDING_REVIEW')h+=`<hr><p class="muted">Type what you saw in the BANK account (not what the student typed):</p><div class="row"><div><label>UTR credited</label><input class="utr" autocomplete="off"></div><div><label>Amount credited (₹)</label><input class="amt" inputmode="decimal" autocomplete="off"></div></div><label class="chk"><input type="checkbox" class="conf"><span>I independently verified this exact UTR and amount as credited in the receiving bank/UPI account.</span></label><button class="ok approve">Approve payment</button><button class="no reject">Reject…</button>`;
if(status==='PAID')h+=`<p class="muted">Verified by ${esc(o.verifiedBy)} at ${esc(o.verifiedAt)} · Collection: ${esc(o.collectionStatus)}${o.collectedAt?' at '+esc(o.collectedAt):''} · Sheet synced: ${o.sheetSynced?'yes':'NO '+esc(o.sheetSyncError||'')} · QR email: ${esc(o.qrEmailStatus)} ${esc(o.qrEmailError||'')}</p><button class="alt sync">Retry sheet sync</button>${o.collectionStatus==='READY'?'<button class="alt resend">Resend QR</button>':''}`;
if(status==='REJECTED')h+=`<p class="muted">Rejected by ${esc(o.rejectedBy)}: ${esc(o.rejectReason)}</p>`;
h+='<p class="msg"></p>';el.innerHTML=h;const msg=t=>el.querySelector('.msg').textContent=t;const on=(s,f)=>{const b=el.querySelector(s);if(b)b.onclick=async()=>{b.disabled=true;try{await f()}catch(e){msg(e.message)}b.disabled=false}};
on('.view',()=>showShot(el.querySelector('.shotbox'),o.orderId));
on('.approve',async()=>{if(!el.querySelector('.conf').checked)return msg('Tick the verification box first.');const d=await api('/admin/orders/'+encodeURIComponent(o.orderId)+'/approve-upi',{method:'POST',body:JSON.stringify({confirmBankVerified:true,confirmedUtr:el.querySelector('.utr').value.trim(),confirmedAmount:Number(el.querySelector('.amt').value)})});msg(d.message+(d.sheetUpdated?' Sheet updated.':' Sheet NOT updated — retry from the Approved tab.'))});
on('.reject',async()=>{const r=prompt('Reason for rejecting (shown to staff only):');if(!r)return;await api('/admin/orders/'+encodeURIComponent(o.orderId)+'/reject',{method:'POST',body:JSON.stringify({reason:r})});msg('Rejected.')});
on('.sync',async()=>{const d=await api('/admin/orders/'+encodeURIComponent(o.orderId)+'/retry-sync',{method:'POST',body:'{}'});msg(d.sheetUpdated?'Sheet updated.':'Sheet sync failed again.')});
on('.resend',async()=>{if(!confirm('Issue a NEW QR and email it? Any earlier QR stops working.'))return;const d=await api('/admin/orders/'+encodeURIComponent(o.orderId)+'/resend-qr',{method:'POST',body:JSON.stringify({resend:true})});msg(d.collectionQrEmailed?'New QR emailed.':'Email failed; try again.')});
return el}
async function load(){$('orders').innerHTML='';try{const st=$('status').value;const d=await api('/admin/orders?status='+st);$('state').textContent=`Signed in as ${d.staff}. ${d.orders.length} order(s).`;d.orders.forEach(o=>$('orders').appendChild(card(o,st)))}catch(e){$('state').textContent=e.message}}
$('load').onclick=load;
</script></body></html>
